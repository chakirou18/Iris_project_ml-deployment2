<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Monitoring review login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}">
<main><h1>ML Monitoring — Reviewer login</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Password <input type="password" name="password" autocomplete="current-password" required></label>
<button type="submit">Log in</button></form></main></html>
