<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — PulseML</title><link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}"></head>
<body class="login-background"><main class="login-card"><div class="login-icon">◈</div>
