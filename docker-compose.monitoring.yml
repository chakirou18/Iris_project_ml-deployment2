services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    environment:
      MODEL_ID: iris-classifier
      MODEL_VERSION: phase2-demo
      MONITORING_METRICS_TOKEN: ${MONITORING_METRICS_TOKEN:?First run python scripts/setup_monitoring_env.py}
      PREDICTION_EVENTS_PATH: /app/data/predictions.jsonl
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:5000:5000"
  evidently:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    command: ["python", "-m", "monitoring.drift_worker"]
    environment:
      PREDICTION_EVENTS_PATH: /app/data/predictions.jsonl
      DRIFT_REPORT_DIR: /app/data/reports
    volumes:
      - ./data:/app/data
    depends_on:
      - iris
  prometheus:
    image: prom/prometheus:v3.7.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/secrets/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - iris
      - evidently
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?First run python scripts/setup_monitoring_env.py}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
volumes:
  prometheus-data:
  grafana-data:
