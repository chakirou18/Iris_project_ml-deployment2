name: Local review preview tests
on:
  push:
    branches: [feature/iris-local-preview-launcher]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "flask>=3,<4" "pytest>=8,<10"
      - run: python -m compileall -q review
      - run: python -m pytest -q tests/test_review.py tests/test_review_preview.py
