name: PulseML incident ingestion
on:
  push:
    branches: [feature/pulseml-auto-incidents]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted test dependencies
        run: python -m pip install "flask>=3,<4" "pytest>=8,<10" "langgraph>=0.6,<2" "pydantic>=2,<3"
      - name: Check compilation and automatic incident lifecycle
        run: |
          python -m compileall -q monitoring/incident_ingestor.py review agents
          python -m pytest -q tests/test_review.py tests/test_review_ui.py tests/test_remediation_ui.py tests/test_incident_ingestion.py
