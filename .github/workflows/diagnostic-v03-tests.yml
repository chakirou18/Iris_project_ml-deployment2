name: PulseML V0.3 AI diagnostic tests
on:
  push:
    branches: [feature/pulseml-v03-intelligent-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies (no live API)
        run: python -m pip install "flask>=3,<4" "pytest>=8,<10" "pydantic>=2,<3" "langgraph>=0.6,<2" "numpy>=1.26,<3" "pandas>=2.2,<3" "scikit-learn>=1.3,<2" joblib
      - name: Check syntax and agent regression
        run: |
          python -m compileall -q agents review monitoring
          python -m pytest -q tests/test_incident_analysis.py tests/test_review.py tests/test_review_ui.py tests/test_incident_ingestion.py
