name: Iris monitoring tests

on:
  push:
    branches:
      - feature/iris-monitoring
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask numpy pandas scikit-learn joblib prometheus-client pytest
      - name: Check syntax
        run: python -m compileall -q application.py monitoring scripts tests
      - name: Run tests
        run: python -m pytest -q tests/test_monitoring.py
