name: Iris monitoring phase 2 tests
on:
  push:
    branches: [feature/iris-monitoring-phase2]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install monitoring dependencies
        run: python -m pip install -r requirements-monitoring.txt
      - name: Check Python syntax
        run: python -m compileall -q application.py monitoring scripts tests
      - name: Run tests
        run: python -m pytest -q tests/test_monitoring.py tests/test_drift.py
      - name: Validate Grafana dashboard JSON
        run: python -m json.tool grafana/dashboards/iris-monitoring.json >/dev/null
      - name: Validate local Compose configuration
        run: |
          python scripts/setup_monitoring_env.py
          docker compose -f docker-compose.monitoring.yml config -q
