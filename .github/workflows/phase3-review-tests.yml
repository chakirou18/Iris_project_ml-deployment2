name: Phase 3 human review tests
on:
  push:
    branches: [feature/iris-human-review-phase3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install "flask>=3,<4" "pytest>=8,<10"
      - name: Compile and test review interface
        run: |
          python -m compileall -q review
          python -m pytest -q tests/test_review.py
