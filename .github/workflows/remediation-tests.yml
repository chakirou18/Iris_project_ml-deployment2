name: PulseML supervised remediation tests
on:
  push:
    branches: [feature/pulseml-supervised-remediation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local-only dependencies
        run: python -m pip install "flask>=3,<4" "pytest>=8,<10" "pandas>=2.2,<3" "scikit-learn>=1.3,<2" "numpy>=1.26,<3" "joblib>=1.3,<2"
      - name: Syntax and security regression
        run: |
          python -m compileall -q remediation review
          python -m pytest -q tests/test_review.py tests/test_review_preview.py tests/test_review_ui.py tests/test_remediation.py
