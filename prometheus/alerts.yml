groups:
  - name: iris-monitoring
    rules:
      - alert: IrisServiceDown
        expr: up{job="iris"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Iris prediction service is unreachable
      - alert: IrisDriftEvaluatorDown
        expr: up{job="evidently"} == 0
        for: 1m
        labels:
          severity: critical
      - alert: IrisDriftEvaluationFailed
        expr: iris_drift_evaluation_status == -1
        for: 1m
        labels:
          severity: warning
      - alert: IrisDataDriftDetected
        expr: (iris_drifted_features_count > 0) and on() (iris_drift_evaluation_status == 1)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: At least one Iris feature exhibits statistically significant drift
      - alert: IrisPredictionErrorsHigh
        expr: sum(rate(iris_prediction_requests_total{status="error"}[5m])) / clamp_min(sum(rate(iris_prediction_requests_total[5m])), 0.000001) > 0.05
        for: 2m
        labels:
          severity: warning
      - alert: IrisPredictionLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(iris_prediction_latency_seconds_bucket[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: warning
