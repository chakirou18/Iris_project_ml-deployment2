apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlops-app
  labels:
    app: mlops-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mlops-app

  template:
    metadata:
      labels:
        app: mlops-app

    spec:
      containers:
        - name: mlops-app
          image: europe-west9-docker.pkg.dev/project-ff8a41de-e8de-4da0-92e/my-repo/mlops-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service

metadata:
  name: mlops-app-service

spec:
  type: LoadBalancer

  selector:
    app: mlops-app

  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000